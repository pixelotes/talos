[workspace]
resolver = "3"
# tools/ holds development-time programs (the classifier trainer); none is
# linked into the `talos` binary.
members = ["crates/*", "tools/*"]
# spikes/ holds standalone throwaway projects with their own Cargo.toml.
exclude = ["spikes"]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/pixelotes/talos"
publish = false

# Every third-party dependency is justified on its own line (DESIGN.md s.9:
# prefer no dependency, then a small one, then a feature-gated one).
[workspace.dependencies]
talos-core = { path = "crates/talos-core", version = "0.3.2" }
# Without its default `knowledge` feature: each dependent turns it on
# through its own `knowledge` feature (the binary does by default).
talos-skills = { path = "crates/talos-skills", version = "0.3.2", default-features = false }
# Derive for the manifest model; the de facto standard, needed by `toml`.
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
# Parses skill manifests (ADR 0007); parse-only, no writer or display code.
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }
# Rule patterns: the parser and the linear-time PikeVM that the `regex` crate
# is built on, used directly (talos-core/src/patterns.rs) so that no matcher
# keeps a per-pattern cache. Only the Unicode classes \b \w \s \d are needed,
# so the other Unicode tables and the perf engines are left out.
regex-syntax = { version = "0.8.5", default-features = false, features = ["std", "unicode-perl"] }
regex-automata = { version = "0.4.9", default-features = false, features = ["std", "syntax", "nfa-pikevm", "unicode-perl", "unicode-word-boundary"] }
# Tests only: the reflector's tests build their own word patterns.
regex = { version = "1.12", default-features = false, features = ["std", "unicode-perl"] }
# NFKC for the normalisation stage (DESIGN.md s.4, stage 0); small, standard.
unicode-normalization = "0.1.24"
# `talos ask --json` (API.md s.1) now, the HTTP server's bodies later; std only.
serde_json = { version = "1.0.140", default-features = false, features = ["std"] }
# The knowledge store (ADR 0005, DEVELOPMENT.md "The SQLite binding"): SQLite
# compiled from the bundled amalgamation, trimmed by LIBSQLITE3_FLAGS in
# .cargo/config.toml. Of the optional rusqlite features only `cache` (prepared
# statements kept between lookups) is used. Behind the
# `knowledge` feature of talos-core.
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "cache"] }
# The vocabulary pack builder (tools/pack, dev-time only, never in the binary):
# streams the Open English WordNet XML (quick-xml: MIT, one dependency,
# memchr), reads it gzipped (flate2 with its pure-Rust backend) and checks the
# sources' SHA-256 sums (sha2). DEVELOPMENT.md, "The vocabulary pack".
quick-xml = { version = "0.42", default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.10", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
# Pedantic lints that are noise at this stage.
module_name_repetitions = "allow"

# Release profile tuned for the 15 MB stripped-binary budget (DESIGN.md s.8).
[profile.release]
# "z" optimises for size; the workload is small and not CPU-bound.
opt-level = "z"
# Fat LTO lets the linker drop unused code across crates.
lto = "fat"
# One codegen unit gives the optimiser the whole crate; smaller, slower build.
codegen-units = 1
# Remove symbols and debug info from the shipped binary.
strip = true
# No unwinding tables or landing pads; a panic aborts the process.
panic = "abort"
