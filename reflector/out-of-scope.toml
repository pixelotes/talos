# their own, so the classifier can say "none of the above" instead of
# forcing the nearest intent. The engine embeds this file to check that its
# model was trained on it; change it, retrain.
#
# What belongs here, in both languages, written natively and not as
# translations of each other:
#
# - requests to write or invent text (poems, letters, jokes, summaries);
# - open questions about the world, opinions, advice;
# - requests for skills not built yet: definitions, translations, what a
#   thing is or has, teaching, weather, timers and reminders, devices;
# - statements about the user or the world;
# - near misses: phrases that share words with an intent and mean something
#   else ("el tiempo vuela", "time to go to bed"), and what lies just past
#   the border of a built skill (a zone's name, an origin, a reminder);
# - conversational acts that are not intents (laughter, "ok", "vale") and
#   noise.
#
# Never copy a phrase of `evals/` here (evals/README.md, independence rule).

