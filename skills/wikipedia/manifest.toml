# wikipedia: what an encyclopedia says about a subject, read from Wikipedia
# when the network is allowed.
#
# The subject is whatever follows "háblame de", "quién fue", "tell me
# about": a person, a place, a thing. The handler searches the Wikipedia of
# the conversation's language, and answers with the opening of the best
# match, quoted as written, its title and its address. The words are
# Wikipedia's, never Talos's: nothing is summarised or rephrased.
#
# "Qué es X" and "what is X" belong to `define`, which asks here only when
# no dictionary has the word. "Quién eres", "tell me about yourself" belong
# to `identity`, whose priority is higher; a subject that is only "ti" or
# "you" is declined.
#
# Slots:
# - `subject`: what to look up, as typed; asked for when missing.
# - `article`: the title chosen in answer to "which one?", when the best
#   match is a page that only lists several subjects of that name.
#
# The `p_*` replies are pieces the handler composes a reply from.

[skill]
id = "wikipedia"
summary.es = "contarte lo que dice Wikipedia sobre algo o alguien"
summary.en = "tell you what Wikipedia says about something or someone"
names.es = ["wikipedia", "enciclopedia"]
names.en = ["wikipedia", "encyclopedia"]
help.es = ["háblame de Valencia", "¿quién fue Ramón y Cajal?", "quiero saber más sobre los volcanes"]
help.en = ["tell me about Lisbon", "who was Ada Lovelace?", "I want to know more about volcanoes"]
capabilities = ["network"]

[[intent]]
id = "wikipedia.about"
priority = 40
courtesy = false
command = { es = "/wiki", en = "/wiki", slot = "subject" }

