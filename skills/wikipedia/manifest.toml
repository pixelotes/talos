  [[intent.slot]]
  name = "subject"
  type = "term"
  required = true
  guess = { after = ["hablame de", "hablame del", "hablame sobre", "cuentame algo de", "cuentame algo sobre", "lo que sepas de", "lo que sepas sobre", "saber mas acerca de", "saber mas sobre", "saber mas de", "que sabes de", "que sabes sobre", "quien es", "quien era", "quien fue", "quienes fueron", "quienes eran", "que fue", "que era", "informacion sobre", "informacion de", "tell me about", "tell me more about", "you know about", "know more about", "to know about", "learn about", "learn more about", "who is", "who was", "who were", "who are", "who's", "what was", "what were", "information about", "info on"] }

  [[intent.slot]]
  name = "article"
  type = "term"

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:y\s+)?(?:me\s+)?(?:hablame|hablanos|hablas|hablemos|cuentame|cuentanos|cuentas)(?:\s+(?:algo|un\s+poco|mas|mas\s+cosas))?\s+(?:de|del|sobre|acerca\s+de|acerca\s+del)\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:cuentame|cuentanos|dime|explicame)\s+(?:todo\s+)?lo\s+que\s+(?:sepas|sabes)\s+(?:de|del|sobre|acerca\s+de|acerca\s+del)\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:quiero|quisiera|querria|me\s+gustaria|necesito)\s+saber\s+(?:mas|algo|mas\s+cosas|algo\s+mas)?\s*(?:de|del|sobre|acerca\s+de|acerca\s+del)\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:y\s+)?que\s+sabes\s+(?:de|del|sobre|acerca\s+de|acerca\s+del)\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:y\s+)?(?:(?:sabes|dime|explicame|cuentame)\s+)?quien(?:es)?\s+(?:es|era|fue|son|eran|fueron)\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:y\s+)?que\s+(?:era|fue|eran|fueron)\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:busca(?:me)?|mira|consulta)\s+(?:a\s+)?(?<subject>.+?)\s+en\s+(?:la\s+)?wikipedia[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:que\s+dice\s+)?(?:la\s+)?wikipedia\s+(?:de\s+|del\s+|sobre\s+)?(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:dame|quiero|tienes)\s+)?info(?:rmacion)?\s+(?:de|del|sobre|acerca\s+de|acerca\s+del)\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^(?:and\s+)?(?:(?:can|could)\s+you\s+)?(?:tell\s+me|talk\s+to\s+me|talk)\s+(?:more\s+|something\s+|a\s+bit\s+|a\s+little\s+)?about\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^tell\s+me\s+(?:everything|all|what)\s+you\s+know\s+(?:about|of)\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^(?:and\s+)?what\s+do\s+you\s+know\s+(?:about|of)\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^i(?:\s+would|.d)?\s+(?:want|like)\s+to\s+(?:know|learn|hear)\s+(?:more\s+|something\s+)?about\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^(?:and\s+)?(?:who\s+(?:is|was|are|were)|who.s)\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^(?:and\s+)?what\s+(?:was|were)\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^(?:look\s+up|search\s+for|find)\s+(?<subject>.+?)\s+(?:on|in)\s+wikipedia[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^(?:what\s+does\s+wikipedia\s+say\s+about|search\s+wikipedia\s+for|wikipedia)\s+(?<subject>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^(?:give\s+me\s+)?(?:some\s+)?info(?:rmation)?\s+(?:on|about)\s+(?<subject>.+?)[\s?.!]*$'

[reply.about]
es = ["{text}"]
en = ["{text}"]

[reply.ask_subject]
es = ["¿Sobre qué quieres que busque?"]
en = ["What should I look up?"]

[reply.ask_article]
es = ["«{subject}» puede ser varias cosas. ¿Cuál: {options}?"]
en = ["\"{subject}\" can be several things. Which one: {options}?"]

[reply.ambiguous]
es = ["«{subject}» puede ser varias cosas en Wikipedia y no sé cuál quieres. Dímelo con más detalle."]
en = ["\"{subject}\" can be several things on Wikipedia and I can't tell which you mean. Tell me more precisely."]

[reply.not_found]
es = ["No encuentro nada sobre «{subject}» en Wikipedia."]
en = ["I can't find anything about \"{subject}\" on Wikipedia."]

[reply.no_network]
es = ["No tengo acceso a la red, así que no puedo consultar Wikipedia."]
en = ["I have no network access, so I can't look that up on Wikipedia."]

[reply.failed]
es = ["No he podido consultar Wikipedia ahora mismo. Prueba dentro de un rato."]
en = ["I couldn't reach Wikipedia just now. Try again in a while."]

# The opening as Wikipedia writes it, then where it comes from.
[reply.p_article]
es = ["{extract}\nFuente: Wikipedia, «{title}»: {url}"]
en = ["{extract}\nSource: Wikipedia, \"{title}\": {url}"]

[reply.p_other_language]
es = ["No lo encuentro en la Wikipedia en español; esto dice la inglesa."]
en = ["I can't find it on the English Wikipedia; this is what the Spanish one says."]

[reply.word_or]
es = ["o"]
en = ["or"]
