    "háblame de Lorca", "háblame del sistema solar", "hablame de messi", "quien fue newton", "quien es elon musk",
    "kien fue franco", "q sabes de bitcoin", "cuentame algo de egipto", "y quién fue Goya", "y qué sabes de Dalí",
    "me cuentas algo sobre Sevilla", "me hablas de la Alhambra", "puedes hablarme de Tesla", "podrías contarme algo de Buda",
