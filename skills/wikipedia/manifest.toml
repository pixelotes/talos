    "quiero información sobre Leonardo da Vinci", "quiero que me hables de Grecia", "quiero que me cuentes algo de Chopin",
    "dime quién fue Hipatia", "dime quién es el autor del Quijote", "sabrías decirme quién fue Magallanes",
    "me interesa saber más sobre la Antártida", "tengo curiosidad por los samuráis", "hablemos de la Luna",
    "qué puedes contarme de Mozart", "qué me puedes decir de Canadá", "qué me cuentas de Australia"]
  en = ["tell me about Lisbon", "tell me about the Second World War", "tell me about volcanoes", "tell me more about Marie Curie",
    "tell me something about Japan", "tell me a bit about Rome", "tell me what you know about Napoleon",
    "tell me everything you know about dinosaurs", "tell me all you know about black holes", "talk to me about Picasso",
