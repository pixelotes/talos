# random: dice, coins, picking among options and random numbers
# (docs/spec/basics.md, `random`).
#
# Patterns match the match form of the message (lower case, accents removed),
# so they are written without accents. They are anchored: the obvious
# phrasings only. The handler draws only through the injected source.
#
# Priorities: a number request (70) beats a pick (60) so that "elige un numero
# entre 1 y 3" is a range; both beat dice and coins (50), whose anchored
# patterns never overlap the others anyway.
#
# Internal slots steer the handler: `plural` ("los dados" is two dice),
# `kind` (mixed or unsupported dice), `minus` (the "-K" of "2d6-3"),
# `incomplete` ("entre 1 y" with no upper bound).
#
# Words the handler needs for faces and the conjunction live in the
# `word_*` replies below: the handler reads them, so that no wording is
# written in code.

[skill]
id = "random"
summary.es = "tirar dados y monedas, elegir entre opciones y dar números al azar"
summary.en = "roll dice, flip coins, pick among options and give random numbers"
names.es = ["azar", "dados", "monedas", "sorteos"]
names.en = ["random", "dice", "coins", "picking"]
help.es = ["tira un dado", "cara o cruz", "elige entre pizza o sushi", "un número del 1 al 10"]
help.en = ["roll two dice", "flip a coin", "pick between tea and coffee", "a number between 1 and 10"]

# ---------------------------------------------------------------- dice

[[intent]]
id = "random.dice"
priority = 50
courtesy = false
command = { es = "/dado", en = "/roll", slot = "notation" }

  [intent.examples]
  es = ["tira un dado", "2d6", "3d8+2", "lanza dos dados", "tira 4 dados de 6 caras", "tírame un d20", "tira los dados", "tira un dado de 7 caras",
    "tira un dado de 20", "lanza un d6", "tira 2 dados", "echa los dados", "lanza tres dados",
    "tira un dado por mí", "2d10", "1d100", "4d6", "d12", "d8+1", "tira 2d6+3",
    "lanza un dado de diez caras", "un dado de 12 caras, porfa", "tira un d4", "dados", "un dado",
    "tira un dado de 100", "echa un dado", "lanza 5 dados de 6", "tira dos dados de veinte caras",
    "tirada de dados", "haz una tirada de 3d6", "lanza el dado", "quiero tirar un dado", "dado de 6",
    "lánzame un par de dados", "tira 1d20 con +5", "un d20 por favor", "tira dados", "rueda un dado",
    "tírame dos dados", "lanza un dado, a ver qué sale", "venga, tira el dado",
    "tira un dado!", "lanza un dado de seis caras", "tira 3d6", "tira un d10", "lanza 2d20",
    "tírame un dado de 8", "tira dos dados de seis", "echa dos dados", "lanza un dado de 4 caras",
    "tira 10 dados", "1d6", "3d4+2", "2d8-1", "tira un dado de veinte", "lanza los dados, porfa",
    "tira el dado", "una tirada de d20", "tira 4 dados", "haz una tirada de dados", "dado de 20 caras",
    "tira 1d12", "lanza un dado y dime qué sale",
    "me gustaría que tiraras un dado", "no tengo dados, ¿me tiras uno?", "tira un dao", "tirame un dado",
    "lanza un dado porfa", "necesito una tirada de 1d20 para mi partida",
    "me tiras dos dados para el parchís?", "para el juego necesito tirar 3d6",
    "a ver qué sale en un dado de 6", "tira un dado de veinte caras para mí", "haz tú la tirada: 2d6",
    "dame un resultado de dado"]
  en = ["roll a die", "roll 2d6", "roll two dice", "d20", "throw 3d8+2", "roll 4 six-sided dice", "roll the dice", "roll a six-sided die",
    "roll a d20", "throw a d6", "roll 2 dice", "toss the dice", "roll three dice", "roll a die for me",
    "2d10", "1d100", "4d6", "d12", "d8+1", "roll 2d6+3", "roll a ten-sided die", "a twelve-sided die please",
    "roll a d4", "dice", "a die", "roll a hundred-sided die", "chuck a die", "roll 5 six-sided dice",
    "roll two twenty-sided dice", "dice roll", "do a 3d6 roll", "roll the die", "i want to roll a die",
    "six-sided die", "roll a pair of dice", "roll 1d20+5", "a d20 please", "throw some dice", "roll d20",
    "can you roll a die", "give me a dice roll",
    "roll a die!", "roll 3d6", "roll a d10", "roll 2d20", "roll me an 8-sided die",
    "roll two six-sided dice", "throw two dice", "roll a four-sided die", "roll 10 dice", "1d6", "3d4+2",
    "2d8-1", "roll a twenty-sided die", "roll the dice please", "roll it", "a d20 roll", "roll 4 dice",
    "do a dice roll", "twenty-sided die", "roll 1d12", "roll a die and tell me the result",
    "i'd like you to roll a die", "i don't have dice, can you roll one?", "rol a die", "roll a dice",
    "roll a die pls", "i need a 1d20 roll for my game", "can you roll two dice for monopoly?",
    "for the game i need to roll 3d6", "let's see what a d6 gives", "roll a twenty-sided die for me",
    "you do the roll: 2d6", "give me a die result"]

  # A guess (no rule matched) finds them next to these words:
  # "oye, lanza tres dados", "échame uno de veinte caras".
  [[intent.slot]]
  name = "count"
  type = "number"
  guess = { before = ["dados", "dice"] }

  [[intent.slot]]
  name = "sides"
  type = "number"
  guess = { before = ["caras", "lados", "sided", "sides", "faces"] }

  [[intent.slot]]
  name = "modifier"
  type = "number"

  [[intent.slot]]
  name = "minus"
  type = "number"
  internal = true

  [[intent.slot]]
  name = "plural"
  type = "term"
  internal = true

  [[intent.slot]]
  name = "kind"
  type = "term"
  internal = true

  # The rest of a `/dado` or `/roll` line, which the handler reads: `2d6`,
  # `d20`, `3d8+2`, or a bare number of sides (`20`).
  [[intent.slot]]
  name = "notation"
  type = "term"
  internal = true

  # Mixed dice ("d6 y d20") and the variants Talos does not roll (keep the
  # best, exploding, advantage).
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:tira|tirame|lanza|lanzame|echa|echame)\s+)?(?:un\s+)?\d*d\d+(?:\s*\+\s*|\s+y\s+)(?:un\s+)?\d*d\d+[\s?.!]*$'
  slots = { kind = "mixed" }

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:tira|tirame|lanza|lanzame|echa|echame)\s.*\d*d\d+.*(?:quedandote|quedandome|quedandose|mejores|peores|ventaja|desventaja|explosiv\w*)'
  slots = { kind = "unsupported" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:(?:roll|throw|toss)\s+)?(?:an?\s+)?\d*d\d+(?:\s*\+\s*|\s+and\s+)(?:an?\s+)?\d*d\d+[\s?.!]*$'
  slots = { kind = "mixed" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:roll|throw|toss)\s.*\d*d\d+.*(?:keep|drop|highest|lowest|best|worst|explod\w*|advantage|disadvantage)'
  slots = { kind = "unsupported" }

  # Notation: NdM, NdM+K, NdM-K, with an optional verb.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:tira|tirame|lanza|lanzame|echa|echame)\s+(?:un\s+)?)?(?<count>\d+)?d(?<sides>\d+)(?:\s*\+\s*(?<modifier>\d+)|\s*-\s*(?<minus>\d+))?(?:\s+(?:por\s+favor|porfa))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:(?:roll|throw|toss)\s+(?:an?\s+|1\s+)?)?(?<count>\d+)?d(?<sides>\d+)(?:\s*\+\s*(?<modifier>\d+)|\s*-\s*(?<minus>\d+))?(?:\s+please)?[\s?.!]*$'

  # In words: "tira un dado", "tira un dado de 7 caras".
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:tira|tirame|lanza|lanzame|echa|echame)\s+(?:un|1)\s+dado(?:\s+de\s+(?<sides>\w+)\s+caras)?(?:\s+(?:por\s+favor|porfa))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:roll|throw|toss)\s+(?:a|an|one|1)\s+(?:(?<sides>\w+)[\s-]sided\s+)?(?:die|dice)(?:\s+please)?[\s?.!]*$'

  # The sides said another way: "tira un dado con 20 caras", "lanza un
  # dado de 20", "roll a die with twenty sides"; and without the verb.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:tira|tirame|lanza|lanzame|echa|echame)\s+)?(?:un|1)\s+dado\s+(?:de|con)\s+(?<sides>\w+)(?:\s+caras)?(?:\s+(?:por\s+favor|porfa))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:(?:roll|throw|toss)\s+)?(?:a|an|one|1)\s+(?:die|dice)\s+with\s+(?<sides>\w+)\s+(?:sides|faces)(?:\s+please)?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:a|an|one|1)\s+(?<sides>\w+)[\s-]sided\s+(?:die|dice)(?:\s+please)?[\s?.!]*$'

  # "los dados" / "the dice": two six-sided dice.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:tira|tirame|lanza|lanzame|echa|echame)\s+los\s+dados(?:\s+de\s+(?<sides>\w+)\s+caras)?(?:\s+(?:por\s+favor|porfa))?[\s?.!]*$'
  slots = { plural = "yes" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:roll|throw|toss)\s+the\s+dice(?:\s+please)?[\s?.!]*$'
  slots = { plural = "yes" }

  # "N dados", "N dados de M caras".
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:tira|tirame|lanza|lanzame|echa|echame)\s+(?<count>\w+)\s+dados(?:\s+de\s+(?<sides>\w+)\s+caras)?(?:\s+(?:por\s+favor|porfa))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:roll|throw|toss)\s+(?<count>\w+)\s+(?:(?<sides>\w+)[\s-]sided\s+)?dice(?:\s+please)?[\s?.!]*$'

