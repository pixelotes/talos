# random: dice, coins, picking among options and random numbers
# (docs/spec/basics.md, `random`).
#
# Patterns match the match form of the message (lower case, accents removed),
# so they are written without accents. They are anchored: the obvious
# phrasings only. The handler draws only through the injected source.
#
# Priorities: a number request (70) beats a pick (60) so that "elige un numero
# entre 1 y 3" is a range; both beat dice and coins (50), whose anchored
# patterns never overlap the others anyway.
#
# Internal slots steer the handler: `plural` ("los dados" is two dice),
# `kind` (mixed or unsupported dice), `minus` (the "-K" of "2d6-3"),
# `incomplete` ("entre 1 y" with no upper bound).
#
# Words the handler needs for faces and the conjunction live in the
# `word_*` replies below: the handler reads them, so that no wording is
# written in code.

[skill]
id = "random"
summary.es = "tirar dados y monedas, elegir entre opciones y dar números al azar"
summary.en = "roll dice, flip coins, pick among options and give random numbers"
names.es = ["azar", "dados", "monedas", "sorteos"]
names.en = ["random", "dice", "coins", "picking"]
help.es = ["tira un dado", "cara o cruz", "elige entre pizza o sushi", "un número del 1 al 10"]
help.en = ["roll two dice", "flip a coin", "pick between tea and coffee", "a number between 1 and 10"]

# ---------------------------------------------------------------- dice

[[intent]]
id = "random.dice"
priority = 50
courtesy = false

  [intent.examples]
  es = ["tira un dado", "2d6", "3d8+2", "lanza dos dados", "tira 4 dados de 6 caras", "tírame un d20", "tira los dados", "tira un dado de 7 caras"]
  en = ["roll a die", "roll 2d6", "roll two dice", "d20", "throw 3d8+2", "roll 4 six-sided dice", "roll the dice", "roll a six-sided die"]

  [[intent.slot]]
  name = "count"
  type = "number"

  [[intent.slot]]
  name = "sides"
  type = "number"

  [[intent.slot]]
  name = "modifier"
  type = "number"

  [[intent.slot]]
  name = "minus"
  type = "number"
  internal = true

  [[intent.slot]]
  name = "plural"
  type = "term"
  internal = true

  [[intent.slot]]
  name = "kind"
  type = "term"
  internal = true

  # Mixed dice ("d6 y d20") and the variants Talos does not roll (keep the
  # best, exploding, advantage).
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:tira|tirame|lanza|lanzame|echa|echame)\s+)?(?:un\s+)?\d*d\d+(?:\s*\+\s*|\s+y\s+)(?:un\s+)?\d*d\d+[\s?.!]*$'
  slots = { kind = "mixed" }

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:tira|tirame|lanza|lanzame|echa|echame)\s.*\d*d\d+.*(?:quedandote|quedandome|quedandose|mejores|peores|ventaja|desventaja|explosiv\w*)'
  slots = { kind = "unsupported" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:(?:roll|throw|toss)\s+)?(?:an?\s+)?\d*d\d+(?:\s*\+\s*|\s+and\s+)(?:an?\s+)?\d*d\d+[\s?.!]*$'
  slots = { kind = "mixed" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:roll|throw|toss)\s.*\d*d\d+.*(?:keep|drop|highest|lowest|best|worst|explod\w*|advantage|disadvantage)'
  slots = { kind = "unsupported" }

  # Notation: NdM, NdM+K, NdM-K, with an optional verb.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:tira|tirame|lanza|lanzame|echa|echame)\s+(?:un\s+)?)?(?<count>\d+)?d(?<sides>\d+)(?:\s*\+\s*(?<modifier>\d+)|\s*-\s*(?<minus>\d+))?(?:\s+(?:por\s+favor|porfa))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:(?:roll|throw|toss)\s+(?:an?\s+|1\s+)?)?(?<count>\d+)?d(?<sides>\d+)(?:\s*\+\s*(?<modifier>\d+)|\s*-\s*(?<minus>\d+))?(?:\s+please)?[\s?.!]*$'

  # In words: "tira un dado", "tira un dado de 7 caras".
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:tira|tirame|lanza|lanzame|echa|echame)\s+(?:un|1)\s+dado(?:\s+de\s+(?<sides>\w+)\s+caras)?(?:\s+(?:por\s+favor|porfa))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:roll|throw|toss)\s+(?:a|an|one|1)\s+(?:(?<sides>\w+)[\s-]sided\s+)?(?:die|dice)(?:\s+please)?[\s?.!]*$'

  # "los dados" / "the dice": two six-sided dice.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:tira|tirame|lanza|lanzame|echa|echame)\s+los\s+dados(?:\s+de\s+(?<sides>\w+)\s+caras)?(?:\s+(?:por\s+favor|porfa))?[\s?.!]*$'
  slots = { plural = "yes" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:roll|throw|toss)\s+the\s+dice(?:\s+please)?[\s?.!]*$'
  slots = { plural = "yes" }

  # "N dados", "N dados de M caras".
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:tira|tirame|lanza|lanzame|echa|echame)\s+(?<count>\w+)\s+dados(?:\s+de\s+(?<sides>\w+)\s+caras)?(?:\s+(?:por\s+favor|porfa))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:roll|throw|toss)\s+(?<count>\w+)\s+(?:(?<sides>\w+)[\s-]sided\s+)?dice(?:\s+please)?[\s?.!]*$'

[[intent]]
id = "random.coin"
priority = 50
courtesy = false

  [intent.examples]
  es = ["tira una moneda", "cara o cruz", "echa una moneda al aire", "lanza una moneda", "tira 3 monedas", "moneda"]
  en = ["flip a coin", "heads or tails", "toss a coin", "coin flip", "flip 3 coins"]

  [[intent.slot]]
  name = "count"
  type = "number"

  # A call ("yo cara", "I call heads") before the request is ignored.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:yo\s+)?(?:cara|cruz)[.,;!]*\s+)?(?:(?:tira|tirame|lanza|lanzame|echa|echame)\s+(?:(?:una|1)\s+moneda|(?<count>\w+)\s+monedas)(?:\s+al\s+aire)?|cara\s+o\s+cruz|cruz\s+o\s+cara|moneda)(?:\s+(?:por\s+favor|porfa))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:i\s+call\s+(?:heads|tails)[.,;!]*\s+)?(?:please\s+)?(?:(?:flip|toss|throw)\s+(?:(?:a|one|1)\s+coin|(?<count>\w+)\s+coins)|heads\s+or\s+tails|tails\s+or\s+heads|coin\s+(?:flip|toss))(?:\s+please)?[\s?.!]*$'

# ---------------------------------------------------------------- pick

[[intent]]
id = "random.pick"
priority = 60
courtesy = false

  [intent.examples]
  es = ["elige entre pizza, sushi y tacos", "escoge uno: rojo, verde, azul", "decide por mí: cine o casa", "sortea a Ana, Luis y Marta", "ayúdame a elegir entre pizza o sushi", "tira una moneda para decidir entre pizza o sushi"]
  en = ["pick one: red, green, blue", "choose between tea and coffee", "decide for me: stay in or go out", "pick a name from Ana, Luis and Marta", "help me choose: pizza or sushi", "flip a coin to choose between tea and coffee"]

  [[intent.slot]]
  name = "options"
  type = "term"
  required = true
  repeated = true

  # A coin or a die used to decide between named options.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:tira|tirame|lanza|lanzame|echa|echame)\s+(?:una\s+moneda|un\s+dado)\s+para\s+(?:decidir|elegir|escoger)\s+(?:entre\s+)?(?<options>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:flip|toss|roll|throw)\s+(?:a\s+coin|a\s+die)\s+to\s+(?:decide|choose|pick)\s+(?:between\s+)?(?<options>.+?)[\s?.!]*$'

  # A verb of choosing, then "entre"/"between"/":" and the options.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:[^,.;:!?]*[,.;]\s+)?(?:ayudame\s+a\s+)?(?:elige|escoge|decide|elegir|escoger|decidir)(?:\s+(?:uno|una|algo|por\s+mi))?(?:\s+entre\s+|\s*:\s*)(?<options>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:[^,.;:!?]*[,.;]\s+)?(?:sortea|sorteame|sortear)\s+(?:a\s+|entre\s+|:\s*)?(?<options>.+?)[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:[^,.;:!?]*[,.;]\s+)?(?:help\s+me\s+)?(?:pick|choose|decide|select)(?:\s+(?:one|something|for\s+me|an?\s+\w+(?:\s+\w+)?))?(?:\s+(?:between|from|among|of)\s+|\s*:\s*)(?<options>.+?)[\s?.!]*$'

  # A verb of choosing with no options: recognised, answered with a hint.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:ayudame\s+a\s+)?(?:elige|escoge|decide|elegir|escoger|decidir)(?:\s+(?:uno|una|algo|por\s+mi))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:help\s+me\s+)?(?:pick|choose|decide)(?:\s+(?:one|something|for\s+me|an?\s+\w+(?:\s+\w+)?))?[\s?.!]*$'

# -------------------------------------------------------------- number

[[intent]]
id = "random.number"
priority = 70
courtesy = false

  [intent.examples]
  es = ["dame un número del 1 al 10", "número aleatorio entre 1 y 100", "un número al azar", "dime un número entre -5 y 5", "5 números del 1 al 49 sin repetir", "del uno al seis", "un número aleatorio hasta 50"]
  en = ["give me a random number between 1 and 10", "random number", "pick a number from 1 to 6", "a number between -5 and 5", "5 numbers from 1 to 49 without repeating", "a random number up to 50"]

  [[intent.slot]]
  name = "low"
  type = "number"

  [[intent.slot]]
  name = "high"
  type = "number"

  [[intent.slot]]
  name = "count"
  type = "number"

  [[intent.slot]]
  name = "distinct"
  type = "term"

  [[intent.slot]]
  name = "incomplete"
  type = "term"
  internal = true

  # "entre 1 y": no upper bound.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:dame|dime|da|di|genera|generame|sacame|saca|elige|escoge|quiero|necesito)\s+)?(?:un\s+|una\s+)?(?:(?<count>\d+|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|doce|quince|veinte|treinta|cuarenta|cincuenta|cien)\s+)?numeros?(?:\s+(?:aleatori[oa]s?|al\s+azar))?\s+entre\s+(?<low>(?:menos\s+|-\s*)?[\w.,^]+)\s+y\s*[?.!]*$'
  slots = { incomplete = "yes" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:(?:give\s+me|get\s+me|pick|choose|generate|draw|tell\s+me|i\s+need|i\s+want)\s+)?(?:an?\s+|one\s+)?(?:(?<count>\d+|two|three|four|five|six|seven|eight|nine|ten|twelve|fifteen|twenty|thirty|forty|fifty|hundred)\s+)?(?:random\s+)?numbers?\s+between\s+(?<low>(?:minus\s+|negative\s+|-\s*)?[\w.,^]+)\s+and\s*[?.!]*$'
  slots = { incomplete = "yes" }

  # With a range: "del 1 al 10", "entre 1 y 100".
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:dame|dime|da|di|genera|generame|sacame|saca|elige|escoge|quiero|necesito)\s+)?(?:un\s+|una\s+)?(?:(?<count>\d+|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|doce|quince|veinte|treinta|cuarenta|cincuenta|cien)\s+)?numeros?(?:\s+(?:aleatori[oa]s?|al\s+azar))?\s+(?:del?|entre)\s+(?<low>(?:menos\s+|-\s*)?[\w.,^]+)\s+(?:al?|y)\s+(?<high>(?:menos\s+|-\s*)?[\w.,^]+)(?:\s+(?<distinct>sin\s+repetir(?:se)?|sin\s+repeticion(?:es)?|distintos|diferentes|no\s+repetidos))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*del\s+(?<low>(?:menos\s+|-\s*)?[\w.,^]+)\s+al\s+(?<high>(?:menos\s+|-\s*)?[\w.,^]+)[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:(?:give\s+me|get\s+me|pick|choose|generate|draw|tell\s+me|i\s+need|i\s+want)\s+)?(?:an?\s+|one\s+)?(?:(?<count>\d+|two|three|four|five|six|seven|eight|nine|ten|twelve|fifteen|twenty|thirty|forty|fifty|hundred)\s+)?(?:random\s+)?numbers?\s+(?:from|between)\s+(?<low>(?:minus\s+|negative\s+|-\s*)?[\w.,^]+)\s+(?:to|and|through)\s+(?<high>(?:minus\s+|negative\s+|-\s*)?[\w.,^]+)(?:\s+(?<distinct>without\s+(?:repeating|repeats|repetition)|with\s+no\s+repeats|no\s+repeats|distinct|unique))?(?:\s+please)?[\s?.!]*$'

  # "hasta 50" / "up to 50": one to the bound.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:dame|dime|da|di|genera|generame|sacame|saca|elige|escoge|quiero|necesito)\s+)?(?:un\s+|una\s+)?(?:(?<count>\d+|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|doce|quince|veinte|treinta|cuarenta|cincuenta|cien)\s+)?numeros?(?:\s+(?:aleatori[oa]s?|al\s+azar))?\s+hasta\s+(?:el\s+)?(?<high>(?:menos\s+|-\s*)?[\w.,^]+)(?:\s+(?<distinct>sin\s+repetir(?:se)?|sin\s+repeticion(?:es)?|distintos|diferentes|no\s+repetidos))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:(?:give\s+me|get\s+me|pick|choose|generate|draw|tell\s+me|i\s+need|i\s+want)\s+)?(?:an?\s+|one\s+)?(?:(?<count>\d+|two|three|four|five|six|seven|eight|nine|ten|twelve|fifteen|twenty|thirty|forty|fifty|hundred)\s+)?(?:random\s+)?numbers?\s+up\s+to\s+(?<high>(?:minus\s+|negative\s+|-\s*)?[\w.,^]+)(?:\s+(?<distinct>without\s+(?:repeating|repeats|repetition)|with\s+no\s+repeats|no\s+repeats|distinct|unique))?(?:\s+please)?[\s?.!]*$'

  # No range: one to a hundred.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:dame|dime|da|di|genera|generame|sacame|saca|elige|escoge|quiero|necesito)\s+)?(?:un\s+|una\s+)?(?:(?<count>\d+|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|doce|quince|veinte|treinta|cuarenta|cincuenta|cien)\s+)?numeros?(?:\s+(?:aleatori[oa]s?|al\s+azar))?(?:\s+(?<distinct>sin\s+repetir(?:se)?|sin\s+repeticion(?:es)?|distintos|diferentes|no\s+repetidos))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:(?:give\s+me|get\s+me|pick|choose|generate|draw|tell\s+me|i\s+need|i\s+want)\s+)?(?:an?\s+|one\s+)?(?:(?<count>\d+|two|three|four|five|six|seven|eight|nine|ten|twelve|fifteen|twenty|thirty|forty|fifty|hundred)\s+)?(?:random\s+)?numbers?(?:\s+at\s+random)?(?:\s+(?<distinct>without\s+(?:repeating|repeats|repetition)|with\s+no\s+repeats|no\s+repeats|distinct|unique))?(?:\s+please)?[\s?.!]*$'

