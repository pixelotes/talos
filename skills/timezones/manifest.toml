  # "qué hora es en Tokio", "me puedes decir qué hora es ahora mismo en
  # Buenos Aires", "qué hora tienen en China", "qué hora es in Tokyo".
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:oye|perdona|a ver),? )?(?:y )?(?:(?:me )?(?:puedes|podrias|sabes|sabrias)(?: decir(?:me)?)? |dime |me dices |necesito saber )?(?:que|q|k) (?:hora|horas) (?:es|son|tienen|hay|marcan los relojes)(?: ahora(?: mismo)?| ahorita| ya| exactamente)? (?:en|in) (?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))[\s?.!]*$'

  # "hora en pekín", "la hora en India", "hora actual en Seúl".
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:oye|a ver),? )?(?:(?:me )?(?:dices|dime|das|puedes decir|sabrias decirme|necesito saber)(?: cual es)? )?(?:la )?hora(?: actual| exacta| local)? en (?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))[\s?.!]*$'

  # "dime la hora de Londres anda", "hora de Moscú, por favor". "Hora de"
  # also starts set phrases ("la hora de la verdad", "hora de cenar"), so a
  # name that is no place is not this intent (`loose`).
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:oye|a ver),? )?(?:(?:me )?(?:dices|dime|das|puedes decir|sabrias decirme|necesito saber)(?: cual es)? )?(?:la )?hora(?: actual| exacta| local)? de (?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))[\s?.!]*$'
  slots = { loose = "yes" }

  # "en Tokio qué hora es", "y en Londres qué hora es".
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*en (?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?)),? (?:que|q) hora (?:es|tienen)[\s?.!]*$'

  # "¿y en Londres?", "y en Lima qué hora es": only right after a question
  # of this skill.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*y en (?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))(?:,? (?:que|q) hora es)?[\s?.!]*$'
  slots = { follow = "yes" }

  # "qué hora es allí", "¿y allí qué hora es?".
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:y )?(?:que|q) hora es (?<place>alli|alla|ahi)[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*y (?<place>alli|alla|ahi),? (?:que|q) hora es[\s?.!]*$'

  # "qué día es en Tokio", "qué fecha tienen en Sídney".
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:y )?(?:a )?(?:que|q) (?:dia|fecha) (?:es|son|tienen|estan)(?: hoy| ahora)? (?:en|in) (?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))[\s?.!]*$'
  slots = { what = "date", loose = "yes" }

  # "qué hora es en", with the place missing.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:que|q) hora es en[\s?.!]*$'

  # "si en Madrid son las 9, ¿qué hora es en Tokio?": a stated time.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:si|cuando) (?:en .+ )?(?:son|sean|es|sea) las? .+(?:que|q) hora .+$'
  slots = { form = "convert" }

  # "what time is it in Tokyo", "what's the time over in Chile", "do you
  # know what time it is in Sydney". Only "in": "at the moment" is clock's.
  [[intent.pattern]]
  lang = "en"
  regex = '^(?:(?:hey|excuse me|so),? )?(?:and )?(?:(?:do you know|can you tell me|could you tell me|tell me|any idea|i need to know|i wonder) )?wh?at(?: time (?:is it|it is|.s it)|(?:.?s| is) the (?:current |local )?time)(?: (?:now|right now))?(?: over)? in (?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))(?:,? please)?[\s?.!]*$'

  # "what time is it at home".
  [[intent.pattern]]
  lang = "en"
  regex = '^(?:and )?what(?: time is it|(?:.?s| is) the time) (?:at|back) (?<place>home)[\s?.!]*$'

  # "time in London", "current time in Delhi and Dubai", "tell me the time
  # in Los Angeles please", "do you know the time in New York".
  [[intent.pattern]]
  lang = "en"
  regex = '^(?:tell me|give me|can you tell me|could you tell me|do you know|i need to know) (?:the )?(?:current |local )?time in (?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))(?:,? please)?[\s?.!]*$'

  # Bare, "time in Tokyo": also said of things that are no place ("time in
  # prison"), so a name the place table does not know is let go (`loose`).
  [[intent.pattern]]
  lang = "en"
  regex = '^(?:the )?(?:current |local )?time in (?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))(?:,? please)?[\s?.!]*$'
  slots = { loose = "yes" }

  # "and in Lima?": only right after a question of this skill.
  [[intent.pattern]]
  lang = "en"
  regex = '^and (?:in|at) (?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))(?:,? what time is it)?[\s?.!]*$'
  slots = { follow = "yes" }

  # "what time is it there".
  [[intent.pattern]]
  lang = "en"
  regex = '^(?:and )?what time is it (?<place>there)[\s?.!]*$'

  # "what's the date in Sydney", "what day is it in Tokyo".
  [[intent.pattern]]
  lang = "en"
  regex = '^(?:and )?what(?:.?s| is) (?:the date|today.s date|the day) (?:in|at) (?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))(?: (?:now|right now|today))?[\s?.!]*$'
  slots = { what = "date", loose = "yes" }

  [[intent.pattern]]
  lang = "en"
  regex = '^(?:and )?what (?:day|date) (?:is it|do they have)(?: over)? (?:in|at) (?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))(?: (?:now|right now|today))?[\s?.!]*$'
  slots = { what = "date", loose = "yes" }

  # "what time is it in", "what's the time over in", with the place missing.
  [[intent.pattern]]
  lang = "en"
  regex = '^what(?: time is it|(?:.?s| is) the time)(?: over)? in[\s?.!]*$'

  # "if it's 9 in Madrid, what time is it in Tokyo": a stated time.
  [[intent.pattern]]
  lang = "en"
  regex = '^(?:if|when) it.?s .+ (?:in|at) .+ what time .+$'
  slots = { form = "convert" }

# --- timezones.difference ----------------------------------------------------------

  # "how late is it in Tokyo", "what time do they have in Rome".
  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:(?:and|so),?\s+)?how\s+late\s+is\s+it\s+(?:over\s+)?in\s+(?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))(?:\s+(?:now|right\s+now))?[\s?.!]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^what\s+time\s+do\s+(?:they|people|you)\s+have\s+(?:over\s+)?in\s+(?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))[\s?.!]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:what(?:\x27s|s|\s+is)\s+the\s+(?:current\s+|local\s+)?time|what\s+hour\s+is\s+it)\s+(?:for|in)\s+(?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))[\s?.!]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:(?:can|could)\s+you\s+)?(?:check|look\s+up|find\s+out|get)\s+(?:me\s+)?(?:the\s+)?(?:current\s+|local\s+)?time\s+in\s+(?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))(?:\s+for\s+me)?(?:,?\s+please)?[\s?.!]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:current\s+|local\s+)?time\s+(?:right\s+)?now\s+in\s+(?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))[\s?.!]*$'''

  # "Tokyo time please": a name that is no place is not a time question.
  [[intent.pattern]]
  lang = "en"
  regex = '''^(?<place>[a-z][a-z .\x27-]*?)\s+time(?:\s+(?:now|right\s+now))?,?\s+please[\s?.!]*$'''
  slots = { loose = "yes" }

  [[intent.pattern]]
  lang = "en"
  regex = '''^what(?:\x27s|s|\s+is)\s+the\s+time\s+like\s+in\s+(?<place>(?:[^\d]+?|(?:utc|gmt) ?[+-]\d{1,2}(?::?\d\d)?))[\s?.!]*$'''

