# timezones: the current time in a place, and the difference in hours between
# two places (docs/spec/state.md, `timezones`).
#
# Places are `term` slots: the handler reads them with its own gazetteer
# (cities and regions in both languages) and with the `place` extractor
# (references such as "mi ciudad", offsets such as "UTC+2"), so that it can
# split "Lima y Bogotá", tell Córdoba (Spain) from Córdoba (Argentina) and
# report the name it used. Patterns match the match form (lower case, no
# accents). The priority is below clock's, so "qué hora es en formato de 12
# horas" stays with clock.
#
# Internal slots: `what` (`date`: "qué día es en Tokio"), `form` (`convert`:
# a stated time to convert, unsupported; `ahead`/`behind`/`same`: a yes/no
# question), `follow` (`yes`: "¿y en Londres?", answered only right after a
# question of this skill), `loose` (`yes`: "hora de…", where a name that is
# no place is declined instead of reported as unknown).

[skill]
id = "timezones"
summary.es = "la hora en otros lugares y la diferencia horaria"
summary.en = "the time in other places and time differences"
names.es = ["zonas horarias", "husos horarios", "hora mundial", "diferencia horaria"]
names.en = ["time zones", "world clock", "time difference"]
help.es = ["qué hora es en Tokio", "diferencia horaria entre Madrid y Lima"]
help.en = ["what time is it in New York", "time difference between London and Delhi"]
capabilities = []

