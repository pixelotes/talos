[reply.forget_kept]
es = ["Vale, no borro nada."]
en = ["Okay, nothing deleted."]

[reply.forget_which]
es = ["¿Qué olvido: tu nombre, tu lugar o tus unidades?"]
en = ["What should I forget: your name, your location or your units?"]

[reply.forget_other]
es = ["Solo guardo tu nombre, tu lugar y tus unidades."]
en = ["I only keep your name, your place and your units."]

[reply.forget_conversation]
es = ["No puedo olvidar la conversación."]
en = ["I can't forget the conversation."]

