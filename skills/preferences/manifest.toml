  regex = '^[\s]*(?:please\s+)?set\s+my\s+(?:location|city|place)\s+to\s+(?<value>[^\s].*?)(?:\s+please)?[\s.!]*$'
  slots = { key = "place", form = "are" }

  # "I'm currently in Madrid": before the name rule below, which would
