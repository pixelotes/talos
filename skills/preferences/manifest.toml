  lang = "es"
  regex = '''^[¿¡\s]*(?:(?:acuerdate\s+de|no\s+te\s+olvides\s+de|que\s+conste)\s+que\s+)(?:me\s+llamo|mi\s+nombre\s+es)\s+(?<value>[^\s].*?)[\s.!]*$'''
