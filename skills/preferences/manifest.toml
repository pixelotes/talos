  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:remember|save|note|store)\s+(?:my\s+name|what\s+my\s+name\s+is)(?:\s+please)?[\s.!]*$'
  slots = { key = "name" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:remember|save|note|store)\s+(?:where\s+i\s+live|my\s+location|my\s+place)(?:\s+please)?[\s.!]*$'
  slots = { key = "place" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:remember|save|note|store)\s+my\s+city(?:\s+please)?[\s.!]*$'
  slots = { key = "place", form = "city" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:i\s+)?(?:prefer|use|want)\s+(?<value>.*\b(?:metric|imperial|miles?|kilometers?|kilometres?|fahrenheit|celsius|pounds?|kilos?|kilograms?|feet|inches?|ounces?|gallons?|liters?|litres?)\b.*?)[\s.!]*$'
  slots = { key = "units" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:switch|change)\s+to\s+(?<value>(?:the\s+)?(?:metric|imperial)(?:\s+(?:units|system))?)(?:\s+please)?[\s.!]*$'
  slots = { key = "units" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:set|change|choose)\s+my\s+units(?:\s+please)?[\s.!]*$'
  slots = { key = "units" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*remember\s+(?:that\s+)?my\s+(?<key>.+?)\s+(?:is|are)\s+.+$'

# ---------------------------------------------------------------- get

  # "me llaman Pepe", "prefiero que me llames Pili".
  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:(?:pues|oye|bueno),?\s+)?(?:(?:todo\s+el\s+mundo|mis\s+amigos|todos)\s+me\s+llaman|me\s+llaman|prefiero\s+que\s+me\s+llames|podrias\s+llamarme|me\s+podrias\s+llamar)\s+(?<value>[^\s].*?)[\s.!]*$'''
