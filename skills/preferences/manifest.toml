  [[intent.slot]]
  name = "key"
  type = "term"
  required = true
  guess = { words = { name = ["nombre", "llamo", "llamame", "llamarme", "llames", "llamar", "name", "call me", "go by"], place = ["vivo", "resido", "ciudad", "ubicacion", "mude", "mudado", "live", "living", "city", "location", "moved", "based in", "home town", "hometown"], units = ["unidades", "sistema metrico", "sistema imperial", "units", "metric", "imperial"] } }

  [[intent.slot]]
  name = "value"
  type = "term"
  required = true
  guess = { after = ["me llamo", "llamame", "llamarme", "me llames", "me puedes llamar", "mi nombre es", "call me", "my name is", "go by", "vivo en", "resido en", "mudado a", "mude a", "mi ciudad es", "live in", "living in", "moved to", "based in", "my city is", "location to", "city to"] }

  [[intent.slot]]
  name = "confirm"
  type = "confirm"

  [[intent.slot]]
  name = "form"
  type = "term"
  internal = true

  # Names.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:pues|oye|bueno),?\s+)?(?:(?:recuerda|apunta|anota|guarda)\s+que\s+)?(?:me\s+llamo|mi\s+nombre\s+es)(?:\s+(?<value>[^\s].*?))?[\s.!]*$'
  slots = { key = "name" }

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:pues|oye|bueno),?\s+)?(?:llamame|puedes\s+llamarme|me\s+puedes\s+llamar|quiero\s+que\s+me\s+llames)(?:\s+(?<value>[^\s].*?))?[\s.!]*$'
  slots = { key = "name", form = "call" }

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*soy\s+(?<value>[^\s,.!?]+(?:\s+[^\s,.!?]+){0,2})[\s.!]*$'
  slots = { key = "name", form = "soy" }

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:recuerda|apunta|anota|guarda|memoriza)\s+(?:mi\s+nombre|como\s+me\s+llamo)[\s.!]*$'
  slots = { key = "name" }

  # Places.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:recuerda|apunta|anota|guarda)\s+que\s+)?(?:ahora\s+|yo\s+)?(?:vivo|resido)\s+en\s+(?<value>[^\s].*?)[\s.!]*$'
  slots = { key = "place" }

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:recuerda|apunta|anota|guarda)\s+que\s+)?(?:ahora\s+|yo\s+)?estoy\s+en\s+(?<value>[^\s].*?)[\s.!]*$'
  slots = { key = "place", form = "are" }

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:recuerda|apunta|anota|guarda)\s+que\s+)?mi\s+ciudad\s+es\s+(?<value>[^\s].*?)[\s.!]*$'
  slots = { key = "place" }

  [[intent.pattern]]
