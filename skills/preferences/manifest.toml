  en = ["my name is Sam", "call me Sammy", "I'm Alex", "you can call me Jo", "my name's Chris",
    "I live in Bristol", "I'm in New York", "my city is Leeds", "remember that I live in Leeds",
    "I moved to Edinburgh", "set my location to Bristol", "I prefer metric", "use imperial units please",
    "I use miles", "I prefer Fahrenheit", "remember my name", "set my units", "remember where I live",
    "hi, my name is Kate", "please call me Bob", "I now live in Dublin", "I've moved to Cardiff",
    "I'm living in Boston", "switch to metric", "I prefer imperial units", "I use kilometres and Celsius",
    "remember that my name is Tom", "note my name", "save where I live", "change my units",
