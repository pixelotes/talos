  required = true
  guess = { words = { name = ["nombre", "llamo", "llamame", "llamarme", "llames", "llamar", "name", "call me", "go by"], place = ["vivo", "resido", "ciudad", "ubicacion", "mude", "mudado", "live", "living", "city", "location", "moved", "based in", "home town", "hometown"], units = ["unidades", "sistema metrico", "sistema imperial", "units", "metric", "imperial"] } }

  [[intent.slot]]
