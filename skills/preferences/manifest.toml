  required = true
  guess = { after = ["me llamo", "llamame", "llamarme", "me llames", "me puedes llamar", "mi nombre es", "call me", "my name is", "go by", "vivo en", "resido en", "mudado a", "mude a", "mi ciudad es", "live in", "living in", "moved to", "based in", "my city is", "location to", "city to"] }

