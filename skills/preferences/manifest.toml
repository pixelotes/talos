# preferences: what Talos remembers about the user across turns and
# restarts — name, place and units, nothing else (docs/spec/state.md).
#
# Patterns match the match form of the message (lower case, accents
# removed), so they are written without accents. They are anchored: the
# obvious phrasings only. Within an intent, the first pattern in the file
# that matches wins, so the specific ones come first and the catch-alls for
# a key Talos does not keep ("mi color favorito") last.
#
# Slots:
# - `key`: which preference — `name`, `place`, `units`; `all` (everything),
#   `other` (one Talos does not keep), `conversation` ("forget our
#   conversation"). Fixed by most patterns; a captured phrase ("mi ciudad")
#   is mapped by the handler.
# - `value`: what to store, in the user's spelling; the handler reports the
#   value it stored (a name with its capitals, `metric`/`imperial`).
# - `confirm`: the answer to "¿Seguro?" (forgetting everything) and to the
#   confirmation a classifier's guess always needs before a change.
# - `form` (internal): which wording of the reply the phrasing calls for.
#
# `preferences.set` and `preferences.forget` change something: the
# classifier never dispatches them alone (talos_core::classifier::
# SIDE_EFFECTS). A guess is offered to the handler only to ask; the
# `guess` cues below say where its key and value are in the message.
#
# Words the handler reads from here are the `word_*` replies (never answered
# as messages).

[skill]
id = "preferences"
summary.es = "recordar tu nombre, dónde vives y tus unidades"
summary.en = "remember your name, where you live and your units"
names.es = ["preferencias", "memoria", "mis datos"]
names.en = ["preferences", "memory", "my details"]
help.es = ["me llamo Ana", "vivo en Sevilla", "prefiero unidades métricas", "¿qué sabes de mí?", "olvida mi nombre"]
help.en = ["my name is Sam", "I live in Bristol", "I prefer metric", "what do you know about me?", "forget my name"]
capabilities = []

