  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:remember\s+(?:that\s+)?)?(?:i\s+live|i\s+now\s+live|i\x27m\s+living|i\s+am\s+living|now\s+i\s+live)\s+in\s+(?<value>[^\s].*?)[\s.!]*$'
