  lang = "es"
  regex = '''^[¿¡\s]*(?:(?:acuerdate\s+de|no\s+te\s+olvides\s+de|que\s+conste|guardate|por\s+cierto,?)\s+que\s+)?(?:por\s+cierto,?\s+)?(?:estoy\s+viviendo|vivo\s+actualmente|vivo\s+ahora|ahora\s+vivo|vivo)\s+en\s+(?<value>[^\s].*?)[\s.!]*$'''
  slots = { key = "place" }

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:mi\s+casa\s+esta|mi\s+ubicacion\s+es|mi\s+residencia\s+esta)\s+(?:en\s+)?(?<value>[^\s].*?)[\s.!]*$'''
  slots = { key = "place" }

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:me\s+he\s+venido\s+a\s+vivir|me\s+he\s+trasladado|me\s+acabo\s+de\s+mudar|me\s+traslade|me\s+fui\s+a\s+vivir)\s+a\s+(?<value>[^\s].*?)[\s.!]*$'''
  slots = { key = "place", form = "are" }

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:ahora\s+mismo|actualmente|de\s+momento)\s+estoy\s+en\s+(?<value>[^\s].*?)[\s.!]*$'''
  slots = { key = "place", form = "are" }

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:pon|cambia|configura|ajusta)\s+mi\s+(?:ciudad|ubicacion|lugar)\s+(?:en|a|como)\s+(?<value>[^\s].*?)[\s.!]*$'''
  slots = { key = "place" }

  # "usa millas", "ponme las distancias en kilómetros".
  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:mejor\s+)?(?:usa|utiliza|ponme|pon|dame|cambia\s+a|pasa\s+a|pasate\s+a|hablame\s+en)\s+(?:las\s+(?:distancias|temperaturas|medidas|unidades|pesos)\s+en\s+)?(?<value>(?:el\s+|los\s+|las\s+)?(?:sistema\s+|unidades\s+|grados\s+)?(?:metric\w*|imperial\w*|millas|kilometros|fahrenheit|celsius|centigrados|libras|kilos))(?:,?\s+(?:por\s+favor|porfa))?[\s.!]*$'''
  slots = { key = "units" }

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:quiero|prefiero)\s+las\s+(?:distancias|temperaturas|medidas|unidades|pesos)\s+en\s+(?<value>(?:el\s+)?(?:sistema\s+)?(?:metric\w*|imperial\w*|millas|kilometros|fahrenheit|celsius|centigrados|libras|kilos))[\s.!]*$'''
  slots = { key = "units" }

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:mejor\s+(?:en\s+)?|las\s+unidades\s+en\s+)(?<value>(?:el\s+)?sistema\s+(?:metrico|imperial))(?:,?\s+(?:por\s+favor|porfa))?[\s.!]*$'''
  slots = { key = "units" }

  # "everyone calls me Liz", "I go by Jim".
  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:(?:everyone|everybody|people|my\s+friends|they\s+all)\s+calls?\s+me|i\s+prefer\s+to\s+be\s+called|i\x27d\s+like\s+(?:you\s+)?to\s+(?:call\s+me|be\s+called)|i\s+go\s+by)\s+(?<value>[^\s].*?)[\s.!]*$'''
