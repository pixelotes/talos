  regex = '''^(?:(?:you\s+)?(?:don\x27t|dont|do\s+not)\s+need\s+to\s+remember|no\s+need\s+to\s+remember|don\x27t\s+keep)\s+(?<key>my\s+name|my\s+location|my\s+city|where\s+i\s+live|my\s+units)(?:\s+any\s*more)?[\s?.!]*$'''

[reply.set_name]
es = ["Mucho gusto, {name}. Lo recordaré."]
en = ["Nice to meet you, {name}. I'll remember that."]

[reply.set_name_call]
es = ["Hecho, te llamaré {name}."]
en = ["Okay, I'll call you {name}."]

[reply.set_place_live]
es = ["Vale, vives en {place}."]
en = ["Got it, you live in {place}."]

[reply.set_place_are]
es = ["Vale, estás en {place}."]
en = ["Got it, you're in {place}."]

[reply.set_units]
es = ["Anotado: unidades {units}."]
en = ["Noted: {units} units."]

[reply.set_ask_name]
es = ["¿Cómo te llamas?"]
en = ["What's your name?"]

[reply.set_ask_place]
es = ["¿Dónde vives?"]
en = ["Where do you live?"]

[reply.set_ask_city]
es = ["¿En qué ciudad vives?"]
en = ["Which city do you live in?"]

[reply.set_ask_zones]
es = ["¿En qué ciudad? Hay varios husos horarios."]
en = ["Which city? There are several time zones."]

[reply.set_ask_units]
es = ["¿Métricas o imperiales?"]
en = ["Metric or imperial?"]

[reply.set_confirm_name]
es = ["¿Quieres que te llame {name}?"]
en = ["Do you want me to call you {name}?"]

[reply.set_confirm_place]
es = ["¿Guardo que vives en {place}?"]
en = ["Shall I remember that you live in {place}?"]

[reply.set_confirm_units]
es = ["¿Guardo que usas unidades {units}?"]
en = ["Shall I remember that you use {units} units?"]

[reply.set_kept]
es = ["Vale, no guardo nada."]
en = ["Okay, nothing stored."]

[reply.set_other]
es = ["Solo recuerdo tu nombre, tu lugar y tus unidades."]
en = ["I only remember your name, your place and your units."]

[reply.set_unknown_place]
es = ["No conozco ese lugar, así que no lo he guardado."]
en = ["I don't know that place, so I haven't stored it."]

[reply.set_which]
es = ["¿{name} de {a} o de {b}?"]
en = ["{name} in {a} or in {b}?"]

[reply.set_which3]
es = ["¿{name} de {a}, de {b} o de {c}?"]
en = ["{name} in {a}, in {b} or in {c}?"]

[reply.get_name]
es = ["Te llamas {name}."]
en = ["Your name is {name}."]

[reply.get_name_yes]
es = ["Sí, {name}."]
en = ["Yes, it's {name}."]

[reply.get_name_know]
es = ["Sí: {name}."]
en = ["Yes: {name}."]

[reply.get_name_bare]
es = ["{name}."]
en = ["{name}."]

[reply.get_place]
es = ["Vives en {place}."]
en = ["You live in {place}."]

[reply.get_place_where]
es = ["En {place}."]
en = ["In {place}."]

[reply.get_units]
es = ["Unidades {units}."]
en = ["{units} units."]

[reply.get_all_n]
es = ["Solo sé que te llamas {name}."]
en = ["Only that your name is {name}."]

[reply.get_all_p]
es = ["Solo sé que vives en {place}."]
en = ["Only that you live in {place}."]

[reply.get_all_u]
