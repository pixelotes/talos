en = ["Your name is {name}, you live in {place} and you use {units} units."]

[reply.get_none_name]
es = ["No sé cómo te llamas."]
en = ["I don't know your name."]

[reply.get_none_who]
es = ["No sé quién eres."]
en = ["I don't know who you are."]

[reply.get_none_place]
