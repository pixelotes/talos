  regex = '^[¿¡\s]*(?:me\s+he\s+mudado|me\s+mude)\s+a\s+(?<value>[^\s].*?)[\s.!]*$'
  slots = { key = "place", form = "are" }

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:recuerda|apunta|anota|guarda)\s+(?:donde\s+vivo|mi\s+lugar|mi\s+ubicacion)[\s.!]*$'
