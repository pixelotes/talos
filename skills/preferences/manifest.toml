  slots = { key = "units" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:please\s+)?(?:set|change|choose)\s+my\s+units(?:\s+please)?[\s.!]*$'
  slots = { key = "units" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*remember\s+(?:that\s+)?my\s+(?<key>.+?)\s+(?:is|are)\s+.+$'

