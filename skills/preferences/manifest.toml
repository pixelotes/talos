  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:recuerda|apunta|anota|guarda)\s+mi\s+ciudad[\s.!]*$'
  slots = { key = "place", form = "city" }

  # Units.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:yo\s+)?(?:prefiero|uso|utilizo|quiero\s+usar|quiero)\s+(?<value>.*\b(?:metric\w*|imperial\w*|millas?|kilometros?|fahrenheit|celsius|centigrados?|libras?|kilos?|pies|pulgadas?|onzas?|galon\w*|litros?)\b.*?)[\s.!]*$'
  slots = { key = "units" }

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:mejor\s+)?(?:usa|cambia\s+a|pasa\s+a|pasate\s+al?|pon)\s+(?<value>(?:el\s+|las\s+)?(?:sistema\s+|unidades\s+)?(?:metric\w*|imperial\w*))(?:\s+(?:por\s+favor|porfa))?[\s.!]*$'
  slots = { key = "units" }

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:configura|cambia|pon|ajusta|elige|apunta|guarda)\s+(?:mis|las)\s+unidades[\s.!]*$'
  slots = { key = "units" }

  # A key Talos does not keep.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:recuerda|apunta|anota|guarda|memoriza)\s+que\s+mi\s+(?<key>.+?)\s+(?:es|son)\s+.+$'

  # English.
  [[intent.pattern]]
  lang = "en"
  regex = '^[\s]*(?:(?:well|so|oh),?\s+)?(?:remember\s+(?:that\s+)?)?(?:my\s+name\s+is|my\s+name\x27s)(?:\s+(?<value>[^\s].*?))?[\s.!]*$'
