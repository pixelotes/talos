  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:dime|dame|sueltame|cuentame|tirame)\s+)?(?:un|una|algun|alguna)\s+(?:refran|dicho|proverbio|frase|sentencia)(?:\s+(?:anda|porfa|por favor))?[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:dime|dame|sueltame)\s+)?(?:una\s+)?galleta de la fortuna[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:dime|dame|sueltame)\s+algo sabio|(?:dime|dame)\s+(?:la|mi)\s+suerte|fortune)[\s?.!]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:(?:dime|dame)\s+)?(?:otro|otra)(?:\s+mas)?(?:\s+(?:refran|dicho|proverbio|frase))?[\s?.!]*$'
  slots = { again = "yes" }

  [[intent.pattern]]
  lang = "en"
  regex = '^[¿¡\s]*(?:(?:tell|give)\s+me\s+)?(?:a|my)\s+(?:fortune|proverb|saying|adage)(?:\s+please)?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[¿¡\s]*(?:(?:give|get)\s+me\s+)?(?:a\s+)?fortune cookie(?:\s+please)?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[¿¡\s]*(?:(?:say|tell me)\s+something wise|fortune)(?:\s+please)?[\s?.!]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^[¿¡\s]*(?:(?:tell|give)\s+me\s+)?(?:another|one more)(?:\s+(?:one|fortune|proverb|saying))?[\s?.!]*$'
  slots = { again = "yes" }

  # "me dices un refrán?", "quiero oír un refrán".
  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:(?:venga|anda|a\s+ver|oye),?\s+)?(?:me\s+(?:dices|cuentas|sueltas|recitas)|recitame|leeme|quiero(?:\s+oir)?|me\s+apetece)\s+(?:un|una|algun|alguna|otro|otra)\s+(?:refran(?:cito)?|dicho|proverbio|galleta\s+de\s+la\s+fortuna)(?:,?\s+(?:anda|porfa|por\s+favor))?[\s?.!]*$'''

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:sabes|conoces|tienes)\s+(?:algun|un|otro)\s+(?:refran|dicho|proverbio)(?:\s+para\s+mi)?[\s?.!]*$'''

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:(?:dime|dame)\s+)?(?:el|la)\s+(?:refran|frase|dicho|proverbio)\s+del\s+dia[\s?.!]*$'''

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:(?:dime|dame)\s+)?(?:una\s+frase\s+(?:sabia|para\s+(?:pensar|reflexionar|hoy))|(?:algo|un\s+poco)\s+de\s+sabiduria(?:\s+popular)?)(?:,?\s+(?:anda|porfa|por\s+favor))?[\s?.!]*$'''

  # "words of wisdom", "an old saying".
  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:(?:give|tell|share)\s+(?:me\s+)?)?(?:some\s+)?(?:words\s+of\s+wisdom|wise\s+words|(?:a|an)\s+(?:wise|old)\s+saying|a\s+bit\s+of\s+wisdom)(?:,?\s+please)?[\s?.!]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:(?:the|a)\s+)?(?:saying|proverb)\s+(?:of|for)\s+the\s+day[\s?.!]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:do\s+you\s+know|got|have\s+you\s+got)\s+any\s+(?:proverbs|sayings|wise\s+words)[\s?.!]*$'''


[reply.saying]
es = ["{text}"]
en = ["{text}"]
