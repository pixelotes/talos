# help: what Talos can do, and how to use one capability
# (docs/spec/basics.md, `help`). Both answers are generated from the
# installed skills' manifests (summaries, names, help examples); nothing here
# lists the skills.
#
# Patterns match the match form (lower case, no accents) and are anchored:
# only the obvious phrasings. A bare "ayuda" or "help me" is the overall list;
# "ayuda con lo de enseñarte cosas" names a skill and is help.skill.

[skill]
id = "help"
summary.es = "ayudarte a usar lo que sé hacer"
summary.en = "help you use what I can do"
names.es = ["ayuda", "comandos"]
names.en = ["help", "commands"]
help.es = ["qué sabes hacer", "cómo funciona la calculadora"]
help.en = ["what can you do", "how do I use the calculator"]
capabilities = []

[[intent]]
id = "help.capabilities"
priority = 50
courtesy = false
command = { es = "/ayuda", en = "/help" }

