  [[intent.slot]]
  name = "skill"
  type = "term"
  required = true

  # Bare "cómo se usa" names nothing: the handler asks which skill.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*como (?:funciona|se usa|se utiliza|uso|puedo usar)(?: esto| eso)?[\s?!.]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*como (?:funciona|se usa|se utiliza|uso|puedo usar) (?<skill>.+?)[\s?!.]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*que puedo (?:preguntarte|pedirte|hacer) (?:sobre|con|de|acerca de) (?<skill>.+?)[\s?!.]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*sabes hacer (?<skill>.+?)[\s?!.]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*ayuda con (?<skill>.+?)[\s?!.]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^how (?:do i use|does|can i use) (?:this|it)(?: work)?[\s?!.]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^how (?:do i use|does|can i use) (?<skill>.+?)(?: work)?[\s?!.]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^what can i (?:ask|do) (?:about|with) (?<skill>.+?)[\s?!.]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^do you (?:do|know how to do) (?<skill>.+?)[\s?!.]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^help with (?<skill>.+?)[\s?!.]*$'

# The list: {skills} is one "· summary" line per installed skill.

  # "para qué sirve la calculadora", "explícame lo de los dados": a skill named by
  # the words people use for it, so "qué hace el Madrid" is not taken.
  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:(?:y|oye|a\s+ver),?\s+)?(?:para\s+que\s+sirven?|que\s+hacen?|que\s+haces\s+con|que\s+se\s+puede\s+hacer\s+con|de\s+que\s+van?|como\s+van?|como\s+funcionan?|explicame|info(?:rmacion)?\s+(?:de|sobre)|instrucciones\s+(?:de|para)|ayuda(?:\s+(?:de|sobre|para))?|ejemplos\s+(?:de|para|con)|ensename\s+a\s+usar|me\s+ensenas\s+a\s+usar)\s+(?<skill>(?:(?:el|la|los|las|lo\s+de(?:\s+(?:el|la|los|las))?)\s+)?(?:calculadora|calc|porcentajes|conversion(?:es)?(?:\s+de\s+unidades)?|reloj|dados|cara\s+o\s+cruz|numeros\s+(?:aleatorios|al\s+azar)|refranes|zonas?\s+horarias?|husos\s+horarios|preferencias))[\s?!.]*$'''

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:tienes|hay|se\s+puede\s+usar)\s+(?:una?\s+)?(?<skill>calculadora|reloj|dados|conversiones|refranes|zonas\s+horarias)[\s?!.]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:(?:so|and|ok),?\s+)?what\s+(?:does|do|can)\s+(?<skill>(?:(?:the|your)\s+)?(?:calculator|calc|percentages|conversions|unit\s+conversions?|clock|dice(?:\s+(?:roller|thing|feature))?|coin\s+(?:flip|toss|thing)|heads\s+or\s+tails|random\s+numbers?|fortunes|proverbs|time\s*zones?(?:\s+(?:thing|stuff|feature))?|preferences))\s+do[\s?!.]*$'''

  # "what's the calculator for", "what does the dice thing do".
  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:(?:so|and|ok),?\s+)?what(?:\x27s|\s+is|\s+are)\s+(?<skill>(?:(?:the|your)\s+)?(?:calculator|calc|percentages|conversions|unit\s+conversions?|clock|dice(?:\s+(?:roller|thing|feature))?|coin\s+(?:flip|toss|thing)|heads\s+or\s+tails|random\s+numbers?|fortunes|proverbs|time\s*zones?(?:\s+(?:thing|stuff|feature))?|preferences))\s+(?:for|good\s+for)[\s?!.]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:(?:so|and|ok),?\s+)?(?:tell\s+me\s+about|explain|info\s+(?:on|about)|more\s+info\s+(?:on|about)|instructions\s+for|examples\s+(?:of|for)|show\s+me\s+how\s+to\s+use|teach\s+me\s+(?:how\s+)?to\s+use|walk\s+me\s+through|usage\s+for)\s+(?<skill>(?:(?:the|your)\s+)?(?:calculator|calc|percentages|conversions|unit\s+conversions?|clock|dice(?:\s+(?:roller|thing|feature))?|coin\s+(?:flip|toss|thing)|heads\s+or\s+tails|random\s+numbers?|fortunes|proverbs|time\s*zones?(?:\s+(?:thing|stuff|feature))?|preferences))(?:\s+please)?[\s?!.]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:do\s+you\s+have|is\s+there)\s+(?:an?\s+)?(?<skill>calculator|clock|dice\s+roller|dice|unit\s+converter|coin\s+flip)[\s?!.]*$'''

[reply.capabilities]
es = ["Esto es lo que sé hacer:\n{skills}"]
en = ["Here's what I can do:\n{skills}"]

# One skill: its summary and two or three example phrases from its manifest.
[reply.skill]
es = ["{name}: {summary}. Prueba: {examples}."]
en = ["{name}: {summary}. Try: {examples}."]

# A skill whose manifest gives no examples.
[reply.skill_bare]
es = ["{name}: {summary}."]
en = ["{name}: {summary}."]

# No installed skill matches the topic.
[reply.unknown]
es = ["No sé hacer eso."]
en = ["I can't do that."]

# No topic given: asks which skill, naming a few.
[reply.which]
es = ["¿El qué? Dime de cuál quieres saber, por ejemplo: {names}."]
en = ["Which one? Tell me what you want to know about, for example: {names}."]
