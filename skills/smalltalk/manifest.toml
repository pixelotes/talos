  # "hola, ¿qué tal?" arrives here with the greeting dropped.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¡¿!\s]*(?:(?:oye|oiga|dime)[\s,]+)?(?:que\s+tal(?:\s+(?:estas|andas|todo|te\s+va))?|como\s+(?:estas|andas|te\s+encuentras|te\s+va|va\s+todo|va|vas)|todo\s+bien|que\s+tal\s+estas)(?:\s+hoy)?(?:[\s,]+talos)?[\s!?.]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¡¿!\s]*(?:(?:oye|oiga|dime)[\s,]+)?como\s+te\s+sientes(?:\s+hoy)?(?:[\s,]+talos)?[\s!?.]*$'
  slots = { topic = "feelings" }

  [[intent.pattern]]
  lang = "en"
  regex = '^(?:(?:hey|so|well)[\s,]+)?(?:how\s+(?:are|r)\s+(?:you|u)(?:\s+doing)?|how\x27?s\s+(?:it\s+going|everything|life)|how\s+are\s+things(?:\s+with\s+you)?|you\s+(?:good|ok|okay|alright)|are\s+you\s+(?:ok|okay|alright)|what\x27?s\s+up|whats\s+up)(?:\s+(?:today|now))?(?:[\s,]+talos)?(?:[\s,.!?]+(?:i\x27?m|i\s+am)\s+[a-z]+)?[\s!?.]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^(?:(?:hey|so|well)[\s,]+)?(?:how\s+are\s+you\s+feeling|how\s+do\s+you\s+feel)(?:\s+(?:today|now))?(?:[\s,]+talos)?[\s!?.]*$'
  slots = { topic = "feelings" }

# Replies. The first variant is the one a conversation opens with.
[reply.hello]
es = ["¡Hola!", "¡Hola, buenas!"]
en = ["Hello!", "Hi!"]

[reply.casual]
es = ["¡Buenas!", "¡Muy buenas!"]
en = ["Hey!", "Hi!"]

[reply.morning]
es = ["¡Buenos días!"]
en = ["Good morning!"]

[reply.afternoon]
es = ["¡Buenas tardes!"]
en = ["Good afternoon!"]

# Spanish has no separate evening greeting: "buenas tardes" lasts until night,
# and "buenas noches" is a farewell.
[reply.evening]
es = ["¡Buenas tardes!"]
en = ["Good evening!"]

[reply.bye]
es = ["Hasta luego.", "Hasta pronto.", "Adiós."]
en = ["Goodbye.", "See you.", "Bye."]

[reply.night]
es = ["Buenas noches."]
en = ["Good night."]

[reply.thanks]
es = ["De nada.", "No hay de qué."]
en = ["You're welcome.", "No problem."]

# A factual status, never a mood: Talos has none to report.
[reply.status]
es = ["Funcionando con normalidad.", "Todo en orden por aquí."]
en = ["Running normally.", "All running normally."]

[reply.feelings]
es = ["No tengo sentimientos. Funciono con normalidad."]
en = ["I don't have feelings. I'm running normally."]
