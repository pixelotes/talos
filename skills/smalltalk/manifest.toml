  # Spanish. Leading "¡"/"¿", trailing "!", "?", "." and the name are optional;
  # stretched letters ("holaaa") are accepted.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¡¿!\s]*(?:hola+|holi+s?|h?ey+|wenas)(?:[\s,]+talos)?[\s!?.]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¡¿!\s]*(?:h?ey+[\s,]+)?(?:muy\s+)?buenas+(?:[\s,]+talos)?[\s!?.]*$'
  slots = { register = "casual" }

  [[intent.pattern]]
  lang = "es"
  regex = '^[¡¿!\s]*(?:muy\s+)?buen(?:os)?\s+dias(?:[\s,]+talos)?[\s!?.]*$'
  slots = { daypart = "morning" }

  [[intent.pattern]]
  lang = "es"
  regex = '^[¡¿!\s]*(?:muy\s+)?buenas\s+tardes(?:[\s,]+talos)?[\s!?.]*$'
  slots = { daypart = "afternoon" }

  # English. "good night" is a farewell (smalltalk.bye) and is not here.
  [[intent.pattern]]
  lang = "en"
  regex = '^(?:hello+|hi+|hiya+|howdy|greetings)(?:\s+there)?(?:[\s,]+talos)?[\s!?.]*$'

  [[intent.pattern]]
  lang = "en"
  regex = '^h?ey+(?:\s+there)?(?:[\s,]+talos)?[\s!?.]*$'
  slots = { register = "casual" }

  [[intent.pattern]]
  lang = "en"
  regex = '^(?:good\s+)?morning(?:[\s,]+talos)?[\s!?.]*$'
  slots = { daypart = "morning" }

  [[intent.pattern]]
  lang = "en"
  regex = '^good\s+afternoon(?:[\s,]+talos)?[\s!?.]*$'
  slots = { daypart = "afternoon" }

  [[intent.pattern]]
  lang = "en"
  regex = '^good\s+evening(?:[\s,]+talos)?[\s!?.]*$'
  slots = { daypart = "evening" }

  # "hello again", "oh hi", "g'day".
  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:(?:oh|well|and)[\s,]+)?(?:hello+|hi+|hiya+|heya|howdy|greetings|hullo|hallo|helo|salutations|ahoy|g\x27day|good\s+day)(?:\s+(?:there|again|friend|buddy|partner|you|hello|hi))?(?:[\s,]+talos)?[\s!?.]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:h?ey+|yo)(?:[\s,]+(?:h?ey+|you|there|talos))*[\s!?.]*$'''
  slots = { register = "casual" }

  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:and\s+)?(?:a\s+(?:very\s+)?)?(?:good\s+)?evening(?:\s+to\s+you)?(?:[\s,]+talos)?[\s!?.]*$'''
  slots = { daypart = "evening" }

  [[intent.pattern]]
  lang = "en"
  regex = '''^(?:a\s+(?:very\s+)?)?(?:good\s+)?morning(?:\s+to\s+you)?(?:[\s,]+talos)?[\s!?.]*$'''
  slots = { daypart = "morning" }

  [[intent.pattern]]
  lang = "en"
  regex = '''^afternoon(?:[\s,]+talos)?[\s!?.]*$'''
  slots = { daypart = "afternoon" }

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¡¿!\s]*(?:hola+|holi+s?)(?:\s+(?:hola+|de\s+nuevo|otra\s+vez|amigo|amiga))(?:[\s,]+talos)?[\s!?.]*$'''

