  # A farewell, optionally behind filler and a thanks ("gracias, adiós":
  # one intent per turn, the farewell wins) and followed by more farewells
  # ("chao, me voy"). "me voy a Sevilla" is a plan and does not match.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¡¿!\s]*(?:(?:bueno|pues|vale|ok|bien|venga)[\s,]+)*(?:(?:muchas\s+)?gracias[\s,]+(?:y\s+)?)?(?:adios|chao+|chau|hasta\s+(?:luego|pronto|manana|la\s+proxima|la\s+vista)|nos\s+vemos(?:\s+luego|\s+pronto)?|me\s+voy)(?:[\s,]+(?:adios|chao+|chau|hasta\s+(?:luego|pronto|manana|la\s+proxima|la\s+vista)|nos\s+vemos(?:\s+luego|\s+pronto)?|me\s+voy|talos))*[\s!?.]*$'

  [[intent.pattern]]
  lang = "es"
  regex = '^[¡¿!\s]*(?:(?:bueno|pues|vale|ok|bien|venga)[\s,]+)*(?:(?:muchas\s+)?gracias[\s,]+(?:y\s+)?)?(?:muy\s+)?buenas\s+noches(?:[\s,]+talos)?[\s!?.]*$'
