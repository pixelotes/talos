# calc: arithmetic, percentages and unit conversion (docs/spec/basics.md, `calc`).
#
# Patterns match the match form (lower case, no accents), so they are written
# without accents. Priorities: a percentage question (70) beats a conversion
# (60), which beats arithmetic (50); "50 + 10%" and "5 km a millas" are not
# arithmetic. Arithmetic rules only find the expression: the handler parses
# it itself (precedence, spoken operators, number words) and declines text
# that is not a calculation. Percentage rules fix the internal `shape` slot
# that says which of the five questions was asked. v0.1 has no open
# questions: a request missing something gets a usage hint.

[skill]
id = "calc"
summary.es = "cuentas, porcentajes y conversiones de unidades"
summary.en = "arithmetic, percentages and unit conversion"
names.es = ["calculadora", "cuentas", "conversiones", "calc"]
names.en = ["calculator", "calc", "conversions", "unit conversion"]
help.es = ["cuánto es 3 por 4", "el 15% de 80", "5 km a millas"]
help.en = ["what's 3 times 4", "15% of 80", "5 km in miles"]

[[intent]]
id = "calc.arithmetic"
priority = 40
courtesy = false

  [intent.examples]
  es = ["cuánto es 2+2", "(3 + 4) * 5", "tres por cuatro", "calcula 2 + 3 * 4", "raíz cuadrada de 144", "2 elevado a 10", "cuánto da 10 entre 4"]
  en = ["what's 12 times 12", "7 + 8 * 2", "three times four", "100 divided by 8", "sqrt(81)", "2 to the power of 8", "what is 9 squared"]

  [[intent.slot]]
  name = "expression"
  type = "term"

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:cuanto\s+(?:es|son|seria|da|vale)|calcula(?:me)?|dime|cual\s+es)\s+(?<expression>(?:[^\d]{0,24}\d|(?:raiz|sqrt|square\s+root|cube\s+root|(?:un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|dieciseis|diecisiete|dieciocho|diecinueve|veinte|veinti[a-z]*|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa|cien|ciento|mil|millon|millones|billon|billones|medio|media|cero))\b).*?)[\s=?.!]*$'''

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?<expression>[-+(]*\s*(?:\d|(?:raiz|sqrt|(?:un|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|dieciseis|diecisiete|dieciocho|diecinueve|veinte|veinti[a-z]*|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa|cien|ciento|mil|millon|millones|billon|billones|medio|media|cero))\b).*?)[\s=?.!]*$'''

  [[intent.pattern]]
  lang = "es"
  regex = '''^[¿¡\s]*(?:calcula(?:me)?|calcular|haz\s+una\s+cuenta)[\s?.!]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^[\s¿]*(?:what(?:'s|\s+is|\s+are)|whats|how\s+much\s+(?:is|are)|calculate|compute|work\s+out|tell\s+me)\s+(?<expression>(?:[^\d]{0,24}\d|(?:sqrt|square\s+root|cube\s+root|(?:a|an|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|thousand|million|billion|half|zero))\b).*?)[\s=?.!]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^[\s¿]*(?<expression>[-+(]*\s*(?:\d|(?:sqrt|square\s+root|cube\s+root|(?:one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety|hundred|thousand|million|billion|half|zero))\b).*?)[\s=?.!]*$'''

  [[intent.pattern]]
  lang = "en"
  regex = '''^[\s¿]*(?:calculate|compute|do\s+some\s+math)[\s?.!]*$'''

