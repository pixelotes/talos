# teach: the user's own phrases ("cuando diga «tira», quiero decir «tira un
# dado»"), listed and forgotten (docs/spec/knowledge.md, `teach.phrase`;
# the phrase parts of `teach.list` and `teach.forget`). Teaching facts
# («aprende que…») is v0.6 and stays out of scope until then.
#
# Patterns match the match form (lower case, no accents; «» become "). The
# split between the phrase and what it means is at «quiero decir» / «me
# refiero a» / "I mean"; quotes help but are optional.
#
# Slots:
# - `phrase`: the user's phrase, as typed.
# - `meaning`: what it should mean, as typed; the handler reports the
#   request it was read as (`intent slot=value …`).
# - `confirm`: the yes/no to replacing a meaning, or to a change the
#   classifier guessed.
# - `kind`: `phrases` or `facts`, when a list asks for one of them.
# - `count`: how many items a list or a forgetting covered (reported).
# - `target`: what to forget: a taught phrase, or `all`.
#
# `teach.phrase` and `teach.forget` change what is stored: the classifier
# never dispatches them alone (talos_core::classifier::SIDE_EFFECTS); on a
# guess the handler restates the change and asks first.
#
# The `will_*` and `doing_*` replies describe a meaning ("tiraré un dado",
# "tirar un dado"), one pair per intent, with the stored slots as
# variables; the handler picks them, and `p_list_item` and `word_and`,
# to compose replies. They are never answered on their own.

[skill]
id = "teach"
summary.es = "aprender tus propias frases para lo que ya sé hacer"
summary.en = "learn your own phrases for what I can already do"
names.es = ["enseñar", "frases", "aprender"]
names.en = ["teach", "phrases", "learn"]
help.es = ["cuando diga «tira», quiero decir «tira un dado»", "¿qué frases te he enseñado?", "olvida lo de «tira»"]
help.en = ["when I say 'flip it' I mean 'toss a coin'", "what phrases have I taught you?", "forget \"flip it\""]
capabilities = []

