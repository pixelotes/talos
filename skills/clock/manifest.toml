    "what time is it?", "time?", "the time please", "can you give me the time",
    "could you tell me what time it is", "what's the exact time", "what time is it exactly",
    "what time is it at the moment", "tell me the current time", "what's the time right now",
    "what time is it currently", "time, please", "hey, what time is it", "do you know the time",
