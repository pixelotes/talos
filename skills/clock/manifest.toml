  [[intent.slot]]
  name = "target"
  type = "term"
  required = true

  [[intent.slot]]
  name = "dir"
  type = "term"
  internal = true

  # "cuánto falta para Navidad", "cuánto falta para las 7", "cuánto queda para
  # pascua"; a bare "cuánto falta" is missing its target.
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:y )?cuanto(?: tiempo)? (?:falta|queda)(?: (?:para|hasta))?(?: (?<target>.+?))?[\s?.!]*$'

  # "cuántos días faltan para el viernes", "días que faltan para nochevieja".
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:y )?(?:cuantos )?dias (?:que )?(?:faltan|quedan) (?:para|hasta) (?<target>.+?)[\s?.!]*$'

  # "cuánto hace desde el 1 de enero de 2000".
  [[intent.pattern]]
  lang = "es"
  regex = '^[¿¡\s]*(?:y )?(?:cuanto(?: tiempo)?|cuantos (?:dias|anos|meses)) (?:hace|ha pasado|han pasado|llevamos) desde (?<target>.+?)[\s?.!]*$'
  slots = { dir = "since" }

  # "how long until Christmas", "how many days until July 4th", "days until
  # Friday"; a bare "how long until" is missing its target.
  [[intent.pattern]]
  lang = "en"
  regex = '^(?:and )?(?:how (?:long|much time)|how many (?:days|hours|minutes|weeks|months)|days|time)(?: is it| is there| are there| left)? (?:until|till|before)(?: (?<target>.+?))?[\s?.!]*$'

  # "how long since July 20, 1969".
  [[intent.pattern]]
  lang = "en"
  regex = '^(?:and )?(?:how long|how many (?:days|years|months|weeks)|days|time)(?: has it been| has passed| have passed)? since (?<target>.+?)[\s?.!]*$'
  slots = { dir = "since" }

# --- replies -------------------------------------------------------------------
#
# Spanish agrees its verb with a single unit ("Falta 1 día", "Faltan 2 días",
# "Es la 1:05", "Son las 13:05"), so those replies come in pairs, `_one` for the
# singular. English says the same either way.

