  en = ["what time is it", "got the time", "time", "what's the time", "tell me the time please", "what time will it be in 8 hours", "what time is it where I am",
    "what time is it now", "what's the time now", "can you tell me the time", "do you know what time it is",
    "what's the current time", "current time", "time please", "the time?", "tell me what time it is",
    "what time do you have", "what time is it right now", "have you got the time", "whats the time",
