    "dime qué hora tenemos", "qué hora es ahorita", "cuál es la hora actual", "y la hora?",
    "qué hora será dentro de una hora", "qué hora será en tres horas y media", "qué hora es, rápido",
    "a qué hora estamos hoy", "hora exacta, porfa",
    "me gustaría saber qué hora es", "no sé qué hora es, me lo dices?", "tengo curiosidad, ¿qué hora es?",
    "que hora es ahora", "q hora es ya", "ke ora es", "perdona que te moleste, ¿me dices la hora?",
