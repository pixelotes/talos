[package]
name = "talos-skills"
description = "Talos built-in skills"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
default = ["knowledge"]
# The dictionary skills (`define`, `translate`) read the knowledge store.
# Off, they are still installed (same manifests, same classifier) and say
# that this build has no dictionary; `teach` does not need the store.
knowledge = ["talos-core/knowledge"]

[dependencies]
talos-core.workspace = true
