[package]
name = "talos-core"
description = "Talos engine: turn, pipeline, NLU, dialog, rendering"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The knowledge store: user.db, packs and the dictionary queries
# (docs/KNOWLEDGE.md). Off, the engine keeps the user's data in user.toml and
# has no store; nothing else changes.
knowledge = ["dep:rusqlite"]

[dependencies]
rusqlite = { workspace = true, optional = true }
serde.workspace = true
toml.workspace = true
regex-syntax.workspace = true
regex-automata.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
regex.workspace = true
