[package]
name = "talos"
description = "Talos binary: CLI and HTTP server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["server"]
# `talos serve` (docs/API.md section 2). Adds no dependency: the HTTP/1.1
# server is written on `std` (ADR 0017). Off, the binary has no listener.
server = []

[dependencies]
talos-core.workspace = true
talos-skills.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "talos"
path = "src/main.rs"

[[example]]
name = "serve_load"
required-features = ["server"]
