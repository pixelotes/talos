name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      # rust-toolchain.toml makes rustup install the pinned channel,
      # components and targets on first cargo invocation.
      - uses: Swatinem/rust-cache@v2.7.8
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # The build without the knowledge store (no SQLite) still works.
      - run: cargo test --workspace --no-default-features
      # The committed models are exactly what training on the manifests gives.
      - run: cargo run --release -p talos-train -- --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@v2.0.12
        with:
          command: check

  release-x86_64:
    name: release x86_64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: Swatinem/rust-cache@v2.7.8
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Size
        run: ls -l target/x86_64-unknown-linux-gnu/release/talos

  release-aarch64-musl:
    name: release aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: Swatinem/rust-cache@v2.7.8
      - uses: mlugg/setup-zig@v2.0.5
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2.49.17
        with:
          tool: cargo-zigbuild@0.19.8
      - name: Build (release profile already strips; see Cargo.toml)
        run: cargo zigbuild --release --locked --target aarch64-unknown-linux-musl
      - name: Report size and enforce budget
        run: |
          bin=target/aarch64-unknown-linux-musl/release/talos
          size=$(stat -c %s "$bin")
          budget=$(tr -d '[:space:]' < .github/binary-size-budget)
          echo "talos aarch64-musl: ${size} bytes (budget ${budget})"
          file "$bin"
          echo "### aarch64-musl binary: ${size} bytes (budget ${budget})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::binary is ${size} bytes, over the ${budget} budget"
            exit 1
          fi
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: talos-aarch64-unknown-linux-musl
          path: target/aarch64-unknown-linux-musl/release/talos
          if-no-files-found: error
