name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      # rust-toolchain.toml makes rustup install the pinned channel,
      # components and targets on first cargo invocation.
      - uses: Swatinem/rust-cache@v2.7.8
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # The build without the knowledge store (no SQLite) still works.
      - run: cargo test --workspace --no-default-features
      # The committed models are exactly what training on the manifests gives.
      - run: cargo run --release -p talos-train -- --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      # Follows the major version: an older pinned release cannot read the
      # current advisory database.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  release-x86_64:
    name: release x86_64-unknown-linux-gnu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: Swatinem/rust-cache@v2.7.8
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Size
        run: ls -l target/x86_64-unknown-linux-gnu/release/talos

  release-aarch64-musl:
    name: release aarch64-unknown-linux-musl
    # Built on an ARM64 runner with musl-gcc, not cross-compiled: the zig
    # linker refuses an argument rustc passes for this target, and the
    # bundled SQLite needs a C compiler for it either way.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: Swatinem/rust-cache@v2.7.8
      - name: Toolchain for a static build
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          rustup target add aarch64-unknown-linux-musl
      - name: Build (release profile already strips; see Cargo.toml)
        run: cargo build --release --locked -p talos --target aarch64-unknown-linux-musl
      - name: Report size and enforce budget
        run: |
          bin=target/aarch64-unknown-linux-musl/release/talos
          size=$(stat -c %s "$bin")
          budget=$(tr -d '[:space:]' < .github/binary-size-budget)
          echo "talos aarch64-musl: ${size} bytes (budget ${budget})"
          file "$bin"
          echo "### aarch64-musl binary: ${size} bytes (budget ${budget})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::binary is ${size} bytes, over the ${budget} budget"
            exit 1
          fi
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: talos-aarch64-unknown-linux-musl
          path: target/aarch64-unknown-linux-musl/release/talos
          if-no-files-found: error
