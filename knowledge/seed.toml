# The seed pack: the fixture of docs/spec/knowledge.md section 1, all of it
# (sources, predicates, concepts with their words and glosses in both
# languages, claims, stock phrases, the word-pair lexicon), hand-written.
#
# Build it with one command (byte-identical output for the same source):
#
#     cargo run -p talos-pack        # writes target/packs/core.talospack
#
# (`talos-pack build SOURCE OUT` builds any pack source.) Copy the result
# into the data directory's `packs/` to install it.
#
# The format is described in docs/KNOWLEDGE.md, "Pack sources". In short:
#
# - a word is a lemma ("guitarra"), or an inline table when it needs more:
#   `rank` (the baseline order of the word's senses, 0 first; default 0),
#   `pos` (`n`, `v`, `adj`, `adv`; default `n`) and `forms`, the inflected
#   forms no rule gives, with their features;
# - `gloss.es` / `gloss.en` is the concept's definition in that language,
#   copied onto every sense of a word of that language;
# - glosses quoted in the specification are copied from it; the others were
#   written for this pack.

[pack]
id = "core"
version = "1.0"
title = "core vocabulary: the fixture of the knowledge specification"
languages = ["es", "en"]
license = "MIT"
notice = "Hand-written for Talos from docs/spec/knowledge.md; MIT licence, like the code."
# Recorded as `source.added_at` and `claim.created_at`.
date = "2026-11-25"
# The source of everything below except the lexicon.
source = "core"

[[source]]
name = "core"
kind = "pack"
license = "MIT"
url = "https://github.com/pixelotes/talos"

[[source]]
name = "lexicon"
kind = "pack"
license = "MIT"
url = "https://github.com/pixelotes/talos"

# docs/spec/knowledge.md 1.2. The inverse is answered from the same claims.
[[predicate]]
name = "is_a"
inverse = "has_kind"
transitive = true

[[predicate]]
name = "part_of"
inverse = "has_part"
transitive = true

[[predicate]]
name = "causes"
inverse = "caused_by"
transitive = true

